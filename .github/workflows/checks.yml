name: WAAGE_LAB Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  js-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax
        run: |
          node --check app.js
          node --check compare.js
          node --check tests/waage_v02.test.js
      - name: Regressionstests
        run: node tests/waage_v02.test.js
